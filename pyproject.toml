[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "Local AI Gaming Highlight & YouTube Shorts Generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "yt-dlp>=2024.08.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "opencv-python>=4.10.0",
    "httpx>=0.27.0",
    "gradio>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
